# Local infrastructure for development and integration tests.
# The app and worker are included but commented-out by default so you can run
# them from your host with hot reload while using these services.

services:
  postgres:
    # pgvector is not in the stock postgres image; this variant ships it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studyos
      POSTGRES_PASSWORD: studyos
      POSTGRES_DB: studyos
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyos']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studyos
      MINIO_ROOT_PASSWORD: studyos123
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # worker:
  #   build: { context: ., target: worker }
  #   env_file: .env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #
  # web:
  #   build: { context: ., target: web }
  #   env_file: .env
  #   ports: ['3000:3000']
  #   depends_on:
  #     postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
